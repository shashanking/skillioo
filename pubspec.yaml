name: skillioo
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  flutter_screenutil: ^5.9.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  flutter_svg: ^2.2.3
  image_picker: ^1.0.7
  file_picker: ^8.1.2
  video_player: ^2.8.6
  path_provider: ^2.1.4
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^2.4.6
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Neue
      fonts:
        - asset: assets/fonts/Neue Montreal Bold 700.otf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit SemiBold.ttf
          weight: 600
